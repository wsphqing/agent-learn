<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="623" viewBox="0 0 1080 623" role="img" aria-labelledby="title desc">
<title id="title">AI 服务：镜像、模型与硬件分开管理</title><desc id="desc">模型文件大小不等于运行内存；容器化也不会自动提供 GPU 加速。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="623" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">DOCKER / 08</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">AI 服务：镜像、模型与硬件分开管理</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">模型文件大小不等于运行内存；容器化也不会自动提供 GPU 加速。</text>
<rect x="35" y="175" width="240" height="115" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="35" y="190" width="4" height="85" rx="2" fill="#2563eb"/><text x="53" y="207" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">调用方 / 业务 API</text><text x="53" y="237" font-size="16" fill="#536982" font-weight="400" text-anchor="start">请求 prompt / 参数</text><text x="53" y="262" font-size="16" fill="#536982" font-weight="400" text-anchor="start">接收 JSON 或流式响应</text><rect x="420" y="175" width="245" height="115" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="420" y="190" width="4" height="85" rx="2" fill="#2563eb"/><text x="438" y="207" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">Ollama 容器</text><text x="438" y="237" font-size="16" fill="#536982" font-weight="400" text-anchor="start">推理服务程序</text><text x="438" y="262" font-size="16" fill="#536982" font-weight="400" text-anchor="start">监听容器 11434</text><rect x="800" y="175" width="245" height="115" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="800" y="190" width="4" height="85" rx="2" fill="#008675"/><text x="818" y="207" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">模型数据卷</text><text x="818" y="237" font-size="16" fill="#536982" font-weight="400" text-anchor="start">模型权重与缓存</text><text x="818" y="262" font-size="16" fill="#536982" font-weight="400" text-anchor="start">/root/.ollama</text><path d="M 275 230 L 420 230" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="347" y="211" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">HTTP API</text><path d="M 800 230 L 665 230" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="732" y="211" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">加载模型</text><rect x="35" y="400" width="290" height="115" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="35" y="415" width="4" height="85" rx="2" fill="#2563eb"/><text x="53" y="432" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">服务镜像</text><text x="53" y="462" font-size="16" fill="#536982" font-weight="400" text-anchor="start">程序与用户态运行库</text><text x="53" y="487" font-size="16" fill="#536982" font-weight="400" text-anchor="start">更新服务后可复用模型</text><rect x="420" y="400" width="625" height="115" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="420" y="415" width="4" height="85" rx="2" fill="#b75a18"/><text x="438" y="432" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">宿主环境：CPU / 内存 / GPU / 驱动</text><text x="438" y="462" font-size="16" fill="#536982" font-weight="400" text-anchor="start">CPU 可入门；GPU 需要兼容设备、宿主机驱动和运行时支持</text><text x="438" y="487" font-size="16" fill="#536982" font-weight="400" text-anchor="start">macOS Docker Desktop 无法靠 --gpus all 使用 Apple Metal</text><path d="M 270 400 L 456 290" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="337" y="345" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">创建服务</text><path d="M 543 400 L 543 290" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="603" y="348" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">计算资源</text><rect x="35" y="548" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="578" font-size="17" fill="#536982" font-weight="400" text-anchor="start">三个阶段分别验收：服务可访问 → 模型已下载 → 实际推理成功。</text></svg>