<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="626" viewBox="0 0 1080 626" role="img" aria-labelledby="title desc">
<title id="title">localhost 取决于请求从哪里发出</title><desc id="desc">发布端口解决宿主机访问；服务名解析解决同一容器网络内的访问。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="626" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">DOCKER / 03</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">localhost 取决于请求从哪里发出</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">发布端口解决宿主机访问；服务名解析解决同一容器网络内的访问。</text>
<rect x="690" y="143" width="355" height="386" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="710" y="176" font-size="20" fill="#172c48" font-weight="700" text-anchor="start">Compose 自定义网络</text><rect x="35" y="224" width="230" height="116" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="35" y="239" width="4" height="86" rx="2" fill="#2563eb"/><text x="53" y="256" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">宿主机浏览器</text><text x="53" y="286" font-size="16" fill="#536982" font-weight="400" text-anchor="start">localhost = 本机</text><text x="53" y="311" font-size="16" fill="#536982" font-weight="400" text-anchor="start">GET /api/visits</text><rect x="345" y="224" width="265" height="116" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="345" y="239" width="4" height="86" rx="2" fill="#b75a18"/><text x="363" y="256" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">宿主机发布端口</text><text x="363" y="286" font-size="16" fill="#536982" font-weight="400" text-anchor="start">127.0.0.1:8080</text><text x="363" y="311" font-size="16" fill="#536982" font-weight="400" text-anchor="start">转发到 web:80</text><rect x="715" y="201" width="305" height="78" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="715" y="216" width="4" height="48" rx="2" fill="#2563eb"/><text x="733" y="233" font-size="21" fill="#172c48" font-weight="650" text-anchor="start">Nginx / web:80</text><rect x="715" y="326" width="305" height="78" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="715" y="341" width="4" height="48" rx="2" fill="#2563eb"/><text x="733" y="358" font-size="21" fill="#172c48" font-weight="650" text-anchor="start">API / api:8000</text><rect x="715" y="450" width="305" height="60" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="715" y="465" width="4" height="30" rx="2" fill="#008675"/><text x="733" y="482" font-size="21" fill="#172c48" font-weight="650" text-anchor="start">DB / db:5432</text><path d="M 265 280 L 345 280" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="305" y="262" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">HTTP</text><path d="M 610 280 L 715 240" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 865 279 L 865 326" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="958" y="308" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">内部 DNS</text><path d="M 865 404 L 865 450" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="958" y="432" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">内部连接</text><rect x="35" y="553" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="583" font-size="17" fill="#536982" font-weight="400" text-anchor="start">浏览器不在 Docker 网络里；它不能直接把 api 或 db 当作可解析的主机名。</text></svg>