<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="638" viewBox="0 0 1080 638" role="img" aria-labelledby="title desc">
<title id="title">容器与虚拟机：隔离在哪一层</title><desc id="desc">从内核归属看差异，比“容器是一台小电脑”的类比更准确。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="638" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">DOCKER / 01</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">容器与虚拟机：隔离在哪一层</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">从内核归属看差异，比“容器是一台小电脑”的类比更准确。</text>
<rect x="35" y="140" width="310" height="404" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="176" font-size="22" fill="#172c48" font-weight="700" text-anchor="start">虚拟机</text><text x="53" y="204" font-size="16" fill="#536982" font-weight="400" text-anchor="start">每台来宾系统有自己的内核</text><rect x="385" y="140" width="310" height="404" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="403" y="176" font-size="22" fill="#172c48" font-weight="700" text-anchor="start">Linux 原生容器</text><text x="403" y="204" font-size="16" fill="#536982" font-weight="400" text-anchor="start">容器共享所在主机的内核</text><rect x="735" y="140" width="310" height="404" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="753" y="176" font-size="22" fill="#172c48" font-weight="700" text-anchor="start">macOS / Windows</text><text x="753" y="204" font-size="16" fill="#536982" font-weight="400" text-anchor="start">Linux 容器在 Linux 环境内</text><rect x="52" y="225" width="130" height="73" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="52" y="240" width="4" height="43" rx="2" fill="#2563eb"/><text x="70" y="257" font-size="18" fill="#172c48" font-weight="650" text-anchor="start">应用 A</text><rect x="198" y="225" width="130" height="73" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="198" y="240" width="4" height="43" rx="2" fill="#2563eb"/><text x="216" y="257" font-size="18" fill="#172c48" font-weight="650" text-anchor="start">应用 B</text><rect x="52" y="314" width="130" height="92" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="52" y="329" width="4" height="62" rx="2" fill="#008675"/><text x="70" y="346" font-size="18" fill="#172c48" font-weight="650" text-anchor="start">来宾 OS</text><text x="70" y="376" font-size="16" fill="#536982" font-weight="400" text-anchor="start">内核 + 依赖</text><rect x="198" y="314" width="130" height="92" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="198" y="329" width="4" height="62" rx="2" fill="#008675"/><text x="216" y="346" font-size="18" fill="#172c48" font-weight="650" text-anchor="start">来宾 OS</text><text x="216" y="376" font-size="16" fill="#536982" font-weight="400" text-anchor="start">内核 + 依赖</text><rect x="52" y="423" width="276" height="93" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="52" y="438" width="4" height="63" rx="2" fill="#b75a18"/><text x="70" y="455" font-size="18" fill="#172c48" font-weight="650" text-anchor="start">Hypervisor / 硬件</text><text x="70" y="485" font-size="16" fill="#536982" font-weight="400" text-anchor="start">虚拟化硬件与系统</text><rect x="402" y="225" width="130" height="111" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="402" y="240" width="4" height="81" rx="2" fill="#2563eb"/><text x="420" y="257" font-size="18" fill="#172c48" font-weight="650" text-anchor="start">容器 A</text><text x="420" y="287" font-size="16" fill="#536982" font-weight="400" text-anchor="start">应用 + 依赖</text><rect x="548" y="225" width="130" height="111" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="548" y="240" width="4" height="81" rx="2" fill="#2563eb"/><text x="566" y="257" font-size="18" fill="#172c48" font-weight="650" text-anchor="start">容器 B</text><text x="566" y="287" font-size="16" fill="#536982" font-weight="400" text-anchor="start">应用 + 依赖</text><rect x="402" y="354" width="276" height="70" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="402" y="369" width="4" height="40" rx="2" fill="#008675"/><text x="420" y="386" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">共享 Linux 内核</text><rect x="402" y="443" width="276" height="73" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="402" y="458" width="4" height="43" rx="2" fill="#b75a18"/><text x="420" y="475" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">宿主机硬件</text><rect x="752" y="225" width="276" height="73" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="752" y="240" width="4" height="43" rx="2" fill="#2563eb"/><text x="770" y="257" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">容器：应用 + 依赖</text><rect x="752" y="314" width="276" height="92" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="752" y="329" width="4" height="62" rx="2" fill="#008675"/><text x="770" y="346" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">Linux 虚拟化环境</text><text x="770" y="376" font-size="16" fill="#536982" font-weight="400" text-anchor="start">Linux 内核 + 容器引擎</text><rect x="752" y="423" width="276" height="93" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="752" y="438" width="4" height="63" rx="2" fill="#b75a18"/><text x="770" y="455" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">macOS / Windows 主机</text><text x="770" y="485" font-size="16" fill="#536982" font-weight="400" text-anchor="start">虚拟化支持 + 硬件</text><rect x="35" y="565" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="595" font-size="17" fill="#536982" font-weight="400" text-anchor="start">镜像封装用户态依赖；常规 Linux 容器不携带并启动一个独立的 Linux 内核。</text></svg>