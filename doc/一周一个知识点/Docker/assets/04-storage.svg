<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="565" viewBox="0 0 1080 565" role="img" aria-labelledby="title desc">
<title id="title">四种存储，四种生命周期</title><desc id="desc">先判断数据应该活多久，再决定写到哪里。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="565" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">DOCKER / 04</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">四种存储，四种生命周期</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">先判断数据应该活多久，再决定写到哪里。</text>
<rect x="35" y="160" width="230" height="296" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="35" y="175" width="4" height="266" rx="2" fill="#2563eb"/><text x="53" y="192" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">容器可写层</text><text x="53" y="222" font-size="16" fill="#536982" font-weight="400" text-anchor="start">位置：容器文件系统</text><text x="53" y="247" font-size="16" fill="#536982" font-weight="400" text-anchor="start">写入临时状态</text><text x="53" y="272" font-size="16" fill="#536982" font-weight="400" text-anchor="start">重启同一容器通常保留</text><text x="53" y="356" font-size="17" fill="#2563eb" font-weight="650" text-anchor="start">删除容器后丢失</text><text x="53" y="388" font-size="15" fill="#536982" font-weight="400" text-anchor="start">适合：可丢弃文件</text><rect x="295" y="160" width="230" height="296" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="295" y="175" width="4" height="266" rx="2" fill="#008675"/><text x="313" y="192" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">命名卷 Volume</text><text x="313" y="222" font-size="16" fill="#536982" font-weight="400" text-anchor="start">位置：Docker 管理</text><text x="313" y="247" font-size="16" fill="#536982" font-weight="400" text-anchor="start">独立存储对象</text><text x="313" y="272" font-size="16" fill="#536982" font-weight="400" text-anchor="start">可重新挂载给新容器</text><text x="313" y="356" font-size="17" fill="#008675" font-weight="650" text-anchor="start">明确删卷才移除</text><text x="313" y="388" font-size="15" fill="#536982" font-weight="400" text-anchor="start">适合：数据库 / 模型</text><rect x="555" y="160" width="230" height="296" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="555" y="175" width="4" height="266" rx="2" fill="#2563eb"/><text x="573" y="192" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">绑定挂载 Bind</text><text x="573" y="222" font-size="16" fill="#536982" font-weight="400" text-anchor="start">位置：指定主机路径</text><text x="573" y="247" font-size="16" fill="#536982" font-weight="400" text-anchor="start">容器直接访问该路径</text><text x="573" y="272" font-size="16" fill="#536982" font-weight="400" text-anchor="start">可配置只读</text><text x="573" y="356" font-size="17" fill="#2563eb" font-weight="650" text-anchor="start">主机文件独立存在</text><text x="573" y="388" font-size="15" fill="#536982" font-weight="400" text-anchor="start">适合：源码 / 配置</text><rect x="815" y="160" width="230" height="296" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="815" y="175" width="4" height="266" rx="2" fill="#b75a18"/><text x="833" y="192" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">tmpfs</text><text x="833" y="222" font-size="16" fill="#536982" font-weight="400" text-anchor="start">位置：内存文件系统</text><text x="833" y="247" font-size="16" fill="#536982" font-weight="400" text-anchor="start">不做持久保存</text><text x="833" y="272" font-size="16" fill="#536982" font-weight="400" text-anchor="start">占用主机内存资源</text><text x="833" y="356" font-size="17" fill="#b75a18" font-weight="650" text-anchor="start">停止后不保留数据</text><text x="833" y="388" font-size="15" fill="#536982" font-weight="400" text-anchor="start">适合：短期临时文件</text><rect x="35" y="492" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="522" font-size="17" fill="#536982" font-weight="400" text-anchor="start">持久化 ≠ 备份。备份要能恢复；数据库优先使用数据库支持的一致性备份方法。</text></svg>