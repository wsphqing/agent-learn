<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="616" viewBox="0 0 1080 616" role="img" aria-labelledby="title desc">
<title id="title">共享镜像层，隔离容器修改</title><desc id="desc">这是分层与写时复制的概念示意，不对应所有存储后端的具体目录布局。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="616" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">DOCKER / 06</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">共享镜像层，隔离容器修改</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">这是分层与写时复制的概念示意，不对应所有存储后端的具体目录布局。</text>
<rect x="140" y="155" width="350" height="100" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="140" y="170" width="4" height="70" rx="2" fill="#b75a18"/><text x="158" y="187" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">容器 A 的可写层</text><text x="158" y="217" font-size="16" fill="#536982" font-weight="400" text-anchor="start">A 的文件变化与临时状态</text><rect x="590" y="155" width="350" height="100" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="590" y="170" width="4" height="70" rx="2" fill="#b75a18"/><text x="608" y="187" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">容器 B 的可写层</text><text x="608" y="217" font-size="16" fill="#536982" font-weight="400" text-anchor="start">B 的文件变化与临时状态</text><path d="M 315 305 L 315 255" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 765 305 L 765 255" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="140" y="305" width="800" height="60" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="140" y="320" width="4" height="30" rx="2" fill="#2563eb"/><text x="158" y="337" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">只读层 3：应用文件</text><rect x="140" y="380" width="800" height="60" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="140" y="395" width="4" height="30" rx="2" fill="#2563eb"/><text x="158" y="412" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">只读层 2：语言运行时与依赖</text><rect x="140" y="455" width="800" height="60" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="140" y="470" width="4" height="30" rx="2" fill="#2563eb"/><text x="158" y="487" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">只读层 1：基础用户态文件系统</text><rect x="35" y="544" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="574" font-size="17" fill="#536982" font-weight="400" text-anchor="start">Copy-on-Write：对共享只读内容的修改形成私有变化；共享卷是另一条数据路径。</text></svg>