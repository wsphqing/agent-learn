<rect width="1080" height="582" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">DOCKER / 05</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">一次 docker run 背后的协作</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">Docker 提供管理体验，低层运行时通过 Linux 内核机制创建容器环境。</text>
