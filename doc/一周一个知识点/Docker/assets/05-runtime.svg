 text-anchor="middle">运行路径</text><rect x="35" y="510" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="540" font-size="17" fill="#536982" font-weight="400" text-anchor="start">runc 完成启动后通常退出；应用进程继续运行，shim 维持相关任务管理。</text></svg>