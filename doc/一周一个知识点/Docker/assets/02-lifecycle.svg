<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="546" viewBox="0 0 1080 546" role="img" aria-labelledby="title desc">
<title id="title">从源码到运行服务</title><desc id="desc">构建、分发和运行是不同阶段；运行中的容器不会自动跟随源码更新。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="546" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">DOCKER / 02</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">从源码到运行服务</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">构建、分发和运行是不同阶段；运行中的容器不会自动跟随源码更新。</text>
<rect x="35" y="165" width="220" height="145" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="35" y="180" width="4" height="115" rx="2" fill="#2563eb"/><text x="53" y="197" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">01 源码与构建说明</text><text x="53" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">应用代码</text><text x="53" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">Dockerfile / 锁文件</text><text x="53" y="277" font-size="16" fill="#536982" font-weight="400" text-anchor="start">构建上下文</text><rect x="302" y="165" width="220" height="145" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="302" y="180" width="4" height="115" rx="2" fill="#2563eb"/><text x="320" y="197" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">02 构建镜像</text><text x="320" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">BuildKit</text><text x="320" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">只读层 + 默认配置</text><text x="320" y="277" font-size="16" fill="#536982" font-weight="400" text-anchor="start">本地制品</text><rect x="569" y="165" width="220" height="145" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="569" y="180" width="4" height="115" rx="2" fill="#2563eb"/><text x="587" y="197" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">03 镜像仓库</text><text x="587" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">清单 / 配置 / 层</text><text x="587" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">tag 指向内容</text><text x="587" y="277" font-size="16" fill="#536982" font-weight="400" text-anchor="start">digest 标识内容</text><rect x="836" y="165" width="209" height="145" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="836" y="180" width="4" height="115" rx="2" fill="#008675"/><text x="854" y="197" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">04 创建容器</text><text x="854" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">启动应用进程</text><text x="854" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">网络 + 可写层</text><text x="854" y="277" font-size="16" fill="#536982" font-weight="400" text-anchor="start">挂载 + 资源限制</text><path d="M 255 240 L 302 240" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="279" y="225" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">build</text><path d="M 522 240 L 569 240" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="545" y="225" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">push</text><path d="M 789 240 L 836 240" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="812" y="225" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">pull</text><rect x="571" y="362" width="474" height="86" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="571" y="377" width="4" height="56" rx="2" fill="#b75a18"/><text x="589" y="394" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">运行时输入</text><text x="589" y="424" font-size="16" fill="#536982" font-weight="400" text-anchor="start">环境配置 · 密钥 · 端口 · 数据卷</text><path d="M 940 362 L 940 310" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="46" y="371" font-size="19" fill="#172c48" font-weight="700" text-anchor="start">常见更新路径</text><text x="46" y="405" font-size="17" fill="#536982" font-weight="400" text-anchor="start">修改源码 → 重新构建 → 更新镜像 → 重建容器</text><rect x="35" y="473" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="503" font-size="17" fill="#536982" font-weight="400" text-anchor="start">镜像可复用，容器可替换；配置和持久数据需要单独管理。</text></svg>