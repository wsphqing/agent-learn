<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="665" viewBox="0 0 1080 665" role="img" aria-labelledby="title desc">
<title id="title">页面即组件树</title><desc id="desc">从上到下逐层组合，每个组件输入 Props、维护自己的状态。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="665" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">REACT / 02</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">页面即组件树</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">从上到下逐层组合，每个组件输入 Props、维护自己的状态。</text>
<rect x="395" y="150" width="290" height="92" rx="16" fill="#f1ecfd" stroke="#c5d4e6"/><rect x="395" y="165" width="4" height="62" rx="2" fill="#6d28d9"/><text x="413" y="182" font-size="22" fill="#172c48" font-weight="650" text-anchor="start">App（根组件）</text><text x="413" y="212" font-size="16" fill="#536982" font-weight="400" text-anchor="start">组合页面结构</text><rect x="155" y="320" width="215" height="100" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="155" y="335" width="4" height="70" rx="2" fill="#2563eb"/><text x="173" y="352" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">Header</text><text x="173" y="382" font-size="16" fill="#536982" font-weight="400" text-anchor="start">标题与导航</text><rect x="430" y="320" width="215" height="100" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="430" y="335" width="4" height="70" rx="2" fill="#2563eb"/><text x="448" y="352" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">TodoPanel</text><text x="448" y="382" font-size="16" fill="#536982" font-weight="400" text-anchor="start">业务区域</text><rect x="705" y="320" width="215" height="100" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="705" y="335" width="4" height="70" rx="2" fill="#2563eb"/><text x="723" y="352" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">Footer</text><text x="723" y="382" font-size="16" fill="#536982" font-weight="400" text-anchor="start">版权与链接</text><path d="M 490 242 L 262 320" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="376" y="282" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">包含</text><path d="M 540 242 L 537 320" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 540 242 L 812 320" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="676" y="282" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">包含</text><rect x="155" y="480" width="215" height="88" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="155" y="495" width="4" height="58" rx="2" fill="#008675"/><text x="173" y="512" font-size="18" fill="#172c48" font-weight="650" text-anchor="start">Logo / Nav</text><text x="173" y="542" font-size="16" fill="#536982" font-weight="400" text-anchor="start">再拆小组件</text><rect x="430" y="480" width="215" height="88" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="430" y="495" width="4" height="58" rx="2" fill="#008675"/><text x="448" y="512" font-size="18" fill="#172c48" font-weight="650" text-anchor="start">TodoInput</text><text x="448" y="542" font-size="16" fill="#536982" font-weight="400" text-anchor="start">输入新增</text><rect x="705" y="480" width="215" height="88" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="705" y="495" width="4" height="58" rx="2" fill="#008675"/><text x="723" y="512" font-size="18" fill="#172c48" font-weight="650" text-anchor="start">TodoList</text><text x="723" y="542" font-size="16" fill="#536982" font-weight="400" text-anchor="start">列表渲染</text><path d="M 262 420 L 262 480" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 537 420 L 537 480" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 812 420 L 812 480" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="592" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="622" font-size="17" fill="#536982" font-weight="400" text-anchor="start">页面 = 组件树；组合优于继承，一个组件只负责一个清晰的职责。</text></svg>