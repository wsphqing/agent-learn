<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="638" viewBox="0 0 1080 638" role="img" aria-labelledby="title desc">
<title id="title">React 在 Web 技术栈中的位置</title><desc id="desc">把界面拆成可复用的组件，用声明式方式描述页面结果。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="638" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">REACT / 01</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">React 在 Web 技术栈中的位置</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">把界面拆成可复用的组件，用声明式方式描述页面结果。</text>
<rect x="35" y="140" width="310" height="404" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="176" font-size="22" fill="#172c48" font-weight="700" text-anchor="start">浏览器三件套</text><text x="53" y="204" font-size="16" fill="#536982" font-weight="400" text-anchor="start">结构 / 样式 / 行为</text><rect x="385" y="140" width="310" height="404" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="403" y="176" font-size="22" fill="#172c48" font-weight="700" text-anchor="start">React</text><text x="403" y="204" font-size="16" fill="#536982" font-weight="400" text-anchor="start">用组件描述界面</text><rect x="735" y="140" width="310" height="404" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="753" y="176" font-size="22" fill="#172c48" font-weight="700" text-anchor="start">用户看到的页面</text><text x="753" y="204" font-size="16" fill="#536982" font-weight="400" text-anchor="start">组合后的真实结果</text><rect x="52" y="225" width="130" height="92" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="52" y="240" width="4" height="62" rx="2" fill="#b75a18"/><text x="70" y="257" font-size="18" fill="#172c48" font-weight="650" text-anchor="start">HTML</text><text x="70" y="287" font-size="16" fill="#536982" font-weight="400" text-anchor="start">结构语义</text><rect x="198" y="225" width="130" height="92" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="198" y="240" width="4" height="62" rx="2" fill="#008675"/><text x="216" y="257" font-size="18" fill="#172c48" font-weight="650" text-anchor="start">CSS</text><text x="216" y="287" font-size="16" fill="#536982" font-weight="400" text-anchor="start">样式与布局</text><rect x="52" y="333" width="276" height="73" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="52" y="348" width="4" height="43" rx="2" fill="#2563eb"/><text x="70" y="365" font-size="18" fill="#172c48" font-weight="650" text-anchor="start">JavaScript</text><text x="70" y="395" font-size="16" fill="#536982" font-weight="400" text-anchor="start">逻辑、事件、数据、DOM 操作</text><rect x="402" y="225" width="130" height="111" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="402" y="240" width="4" height="81" rx="2" fill="#2563eb"/><text x="420" y="257" font-size="18" fill="#172c48" font-weight="650" text-anchor="start">组件 A</text><text x="420" y="287" font-size="16" fill="#536982" font-weight="400" text-anchor="start">JSX + 样式 + 状态</text><rect x="548" y="225" width="130" height="111" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="548" y="240" width="4" height="81" rx="2" fill="#2563eb"/><text x="566" y="257" font-size="18" fill="#172c48" font-weight="650" text-anchor="start">组件 B</text><text x="566" y="287" font-size="16" fill="#536982" font-weight="400" text-anchor="start">JSX + 样式 + 状态</text><rect x="402" y="354" width="276" height="70" rx="16" fill="#f1ecfd" stroke="#c5d4e6"/><rect x="402" y="369" width="4" height="40" rx="2" fill="#6d28d9"/><text x="420" y="386" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">组件树（复用与组合）</text><rect x="402" y="443" width="276" height="73" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="402" y="458" width="4" height="43" rx="2" fill="#b75a18"/><text x="420" y="475" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">React 渲染到真实 DOM</text><rect x="752" y="225" width="276" height="92" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="752" y="240" width="4" height="62" rx="2" fill="#008675"/><text x="770" y="257" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">静态页面</text><text x="770" y="287" font-size="16" fill="#536982" font-weight="400" text-anchor="start">HTML / CSS / 图片</text><rect x="752" y="333" width="276" height="92" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="752" y="348" width="4" height="62" rx="2" fill="#b75a18"/><text x="770" y="365" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">交互界面</text><text x="770" y="395" font-size="16" fill="#536982" font-weight="400" text-anchor="start">事件、状态、数据</text><rect x="752" y="443" width="276" height="73" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="752" y="458" width="4" height="43" rx="2" fill="#2563eb"/><text x="770" y="475" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">浏览器渲染与绘制</text><rect x="35" y="565" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="595" font-size="17" fill="#536982" font-weight="400" text-anchor="start">React 不替代 HTML 与 CSS：它负责用组件描述界面、把状态变成 DOM。</text></svg>