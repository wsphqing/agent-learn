<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="623" viewBox="0 0 1080 623" role="img" aria-labelledby="title desc">
<title id="title">React 与后端：请求的完整链路</title><desc id="desc">组件发起请求、后端返回数据、组件根据三态渲染界面。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="623" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">REACT / 10</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">React 与后端：请求的完整链路</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">组件发起请求、后端返回数据、组件根据三态渲染界面。</text>
<rect x="35" y="175" width="240" height="115" rx="16" fill="#f1ecfd" stroke="#c5d4e6"/><rect x="35" y="190" width="4" height="85" rx="2" fill="#6d28d9"/><text x="53" y="207" font-size="21" fill="#172c48" font-weight="650" text-anchor="start">React 组件</text><text x="53" y="237" font-size="16" fill="#536982" font-weight="400" text-anchor="start">发起请求</text><text x="53" y="262" font-size="16" fill="#536982" font-weight="400" text-anchor="start">展示数据 / 加载态</text><rect x="420" y="175" width="245" height="115" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="420" y="190" width="4" height="85" rx="2" fill="#2563eb"/><text x="438" y="207" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">fetch(&#x27;/api/todos&#x27;)</text><text x="438" y="237" font-size="16" fill="#536982" font-weight="400" text-anchor="start">GET / POST / DELETE</text><text x="438" y="262" font-size="16" fill="#536982" font-weight="400" text-anchor="start">返回 Promise</text><rect x="800" y="175" width="245" height="115" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="800" y="190" width="4" height="85" rx="2" fill="#008675"/><text x="818" y="207" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">后端 API 服务</text><text x="818" y="237" font-size="16" fill="#536982" font-weight="400" text-anchor="start">处理业务逻辑</text><text x="818" y="262" font-size="16" fill="#536982" font-weight="400" text-anchor="start">读写数据库</text><path d="M 275 230 L 420 230" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="347" y="211" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">HTTP 请求</text><path d="M 800 230 L 665 230" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="732" y="211" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">HTTP 响应</text><rect x="35" y="400" width="290" height="115" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="35" y="415" width="4" height="85" rx="2" fill="#b75a18"/><text x="53" y="432" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">请求三态</text><text x="53" y="462" font-size="16" fill="#536982" font-weight="400" text-anchor="start">loading：加载中</text><text x="53" y="487" font-size="16" fill="#536982" font-weight="400" text-anchor="start">data：成功数据</text><text x="53" y="512" font-size="16" fill="#536982" font-weight="400" text-anchor="start">error：失败信息</text><rect x="420" y="400" width="625" height="115" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="420" y="415" width="4" height="85" rx="2" fill="#2563eb"/><text x="438" y="432" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">开发注意事项</text><text x="438" y="462" font-size="16" fill="#536982" font-weight="400" text-anchor="start">同源或配置代理，避免跨域困扰</text><text x="438" y="487" font-size="16" fill="#536982" font-weight="400" text-anchor="start">请求参数与响应结构要约定好</text><text x="438" y="512" font-size="16" fill="#536982" font-weight="400" text-anchor="start">错误与重试是体验的一部分</text><path d="M 270 400 L 456 290" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="337" y="345" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">发起请求</text><path d="M 543 400 L 543 290" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="603" y="348" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">状态更新</text><rect x="35" y="548" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="578" font-size="17" fill="#536982" font-weight="400" text-anchor="start">浏览器不能直接读数据库：所有数据都通过 API 进出。</text></svg>