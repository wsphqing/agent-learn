<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="631" viewBox="0 0 1080 631" role="img" aria-labelledby="title desc">
<title id="title">并发渲染与优先级调度</title><desc id="desc">紧急更新可以打断低优先级渲染；被打断的工作可以丢弃重做。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="631" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">REACT / 17</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">并发渲染与优先级调度</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">紧急更新可以打断低优先级渲染；被打断的工作可以丢弃重做。</text>
<rect x="35" y="150" width="1010" height="150" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="55" y="178" font-size="19" fill="#172c48" font-weight="700" text-anchor="start">渲染工作单元的时间切片（示意）</text><rect x="60" y="205" width="180" height="70" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="60" y="220" width="4" height="40" rx="2" fill="#b75a18"/><text x="78" y="237" font-size="17" fill="#172c48" font-weight="650" text-anchor="start">更新 A（点击）</text><text x="78" y="267" font-size="16" fill="#536982" font-weight="400" text-anchor="start">紧急 · 高优先级</text><rect x="320" y="205" width="480" height="70" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="320" y="220" width="4" height="40" rx="2" fill="#2563eb"/><text x="338" y="237" font-size="17" fill="#172c48" font-weight="650" text-anchor="start">更新 B（大列表）</text><text x="338" y="267" font-size="16" fill="#536982" font-weight="400" text-anchor="start">useTransition 标记为低优先级</text><rect x="880" y="205" width="130" height="70" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="880" y="220" width="4" height="40" rx="2" fill="#008675"/><text x="898" y="237" font-size="16" fill="#172c48" font-weight="650" text-anchor="start">更新 C</text><text x="898" y="267" font-size="16" fill="#536982" font-weight="400" text-anchor="start">普通</text><path d="M 240 240 L 320 240" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="280" y="222" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">打断</text><path d="M 800 240 L 880 240" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="46" y="360" font-size="19" fill="#172c48" font-weight="700" text-anchor="start">时间轴：高优先级插入，低优先级让路</text><rect x="46" y="380" width="996" height="72" rx="16" fill="#fff" stroke="#c5d4e6"/><rect x="60" y="392" width="120" height="48" rx="16" fill="#b91c1c" stroke="#c5d4e6"/><text x="75" y="422" font-size="19" fill="#fff" font-weight="700" text-anchor="start">A</text><rect x="200" y="392" width="300" height="48" rx="16" fill="#2563eb" stroke="#c5d4e6"/><text x="230" y="422" font-size="17" fill="#fff" font-weight="400" text-anchor="start">B：渲染一部分</text><rect x="520" y="392" width="120" height="48" rx="16" fill="#b91c1c" stroke="#c5d4e6"/><text x="535" y="422" font-size="17" fill="#fff" font-weight="400" text-anchor="start">A 再插入</text><rect x="660" y="392" width="140" height="48" rx="16" fill="#008675" stroke="#c5d4e6"/><text x="690" y="422" font-size="17" fill="#fff" font-weight="400" text-anchor="start">B 重新渲染</text><text x="46" y="492" font-size="19" fill="#172c48" font-weight="700" text-anchor="start">配合 Suspense</text><text x="46" y="526" font-size="17" fill="#536982" font-weight="400" text-anchor="start">低优先级更新未就绪时先显示 fallback（加载占位），数据到达后再替换。</text><rect x="35" y="558" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="588" font-size="17" fill="#536982" font-weight="400" text-anchor="start">并发不是“同时执行”，而是“渲染可中断、按优先级调度”，让输入响应不被大任务卡住。</text></svg>