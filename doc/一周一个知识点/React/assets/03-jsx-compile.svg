<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="546" viewBox="0 0 1080 546" role="img" aria-labelledby="title desc">
<title id="title">从 JSX 到真实 DOM</title><desc id="desc">写 JSX、编成元素、构建虚拟树，再交给浏览器渲染。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="546" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">REACT / 03</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">从 JSX 到真实 DOM</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">写 JSX、编成元素、构建虚拟树，再交给浏览器渲染。</text>
<rect x="35" y="165" width="240" height="150" rx="16" fill="#f1ecfd" stroke="#c5d4e6"/><rect x="35" y="180" width="4" height="120" rx="2" fill="#6d28d9"/><text x="53" y="197" font-size="21" fill="#172c48" font-weight="650" text-anchor="start">JSX 源码</text><text x="53" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">&lt;h1&gt;你好&lt;/h1&gt;</text><text x="53" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">&lt;Button onClick={fn}/&gt;</text><rect x="335" y="165" width="240" height="150" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="335" y="180" width="4" height="120" rx="2" fill="#2563eb"/><text x="353" y="197" font-size="21" fill="#172c48" font-weight="650" text-anchor="start">React.createElement</text><text x="353" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">描述界面的普通对象</text><text x="353" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">React 元素（element）</text><rect x="635" y="165" width="240" height="150" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="635" y="180" width="4" height="120" rx="2" fill="#008675"/><text x="653" y="197" font-size="21" fill="#172c48" font-weight="650" text-anchor="start">虚拟 DOM 树</text><text x="653" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">元素组成的树</text><text x="653" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">可比较、可复用</text><rect x="935" y="165" width="135" height="150" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="935" y="180" width="4" height="120" rx="2" fill="#b75a18"/><text x="953" y="197" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">真实 DOM</text><text x="953" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">浏览器节点</text><text x="953" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">页面上的结果</text><path d="M 275 240 L 335 240" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="305" y="222" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">编译</text><path d="M 575 240 L 635 240" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="605" y="222" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">创建</text><path d="M 875 240 L 935 240" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="905" y="222" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">渲染</text><text x="46" y="386" font-size="19" fill="#172c48" font-weight="700" text-anchor="start">组件函数</text><text x="46" y="420" font-size="17" fill="#536982" font-weight="400" text-anchor="start">UI 是数据的函数：render(state) → 元素 → DOM</text><rect x="35" y="473" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="503" font-size="17" fill="#536982" font-weight="400" text-anchor="start">JSX 不是 HTML：它是 JavaScript 的语法扩展，最终编译为 React 元素。</text></svg>