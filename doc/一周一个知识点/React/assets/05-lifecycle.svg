<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="565" viewBox="0 0 1080 565" role="img" aria-labelledby="title desc">
<title id="title">组件生命周期与副作用</title><desc id="desc">理解组件从挂载到卸载的三个阶段，以及 effect 的时机。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="565" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">REACT / 05</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">组件生命周期与副作用</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">理解组件从挂载到卸载的三个阶段，以及 effect 的时机。</text>
<rect x="35" y="160" width="290" height="180" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="35" y="175" width="4" height="150" rx="2" fill="#2563eb"/><text x="53" y="192" font-size="21" fill="#172c48" font-weight="650" text-anchor="start">挂载 Mount</text><text x="53" y="222" font-size="16" fill="#536982" font-weight="400" text-anchor="start">组件首次出现</text><text x="53" y="247" font-size="16" fill="#536982" font-weight="400" text-anchor="start">执行 effect（如请求）</text><text x="53" y="272" font-size="16" fill="#536982" font-weight="400" text-anchor="start">清理函数暂存</text><rect x="395" y="160" width="290" height="180" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="395" y="175" width="4" height="150" rx="2" fill="#b75a18"/><text x="413" y="192" font-size="21" fill="#172c48" font-weight="650" text-anchor="start">更新 Update</text><text x="413" y="222" font-size="16" fill="#536982" font-weight="400" text-anchor="start">props / state 变化</text><text x="413" y="247" font-size="16" fill="#536982" font-weight="400" text-anchor="start">组件重新渲染</text><text x="413" y="272" font-size="16" fill="#536982" font-weight="400" text-anchor="start">依赖变化时重跑 effect</text><rect x="755" y="160" width="290" height="180" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="755" y="175" width="4" height="150" rx="2" fill="#008675"/><text x="773" y="192" font-size="21" fill="#172c48" font-weight="650" text-anchor="start">卸载 Unmount</text><text x="773" y="222" font-size="16" fill="#536982" font-weight="400" text-anchor="start">组件从树中移除</text><text x="773" y="247" font-size="16" fill="#536982" font-weight="400" text-anchor="start">执行清理函数</text><text x="773" y="272" font-size="16" fill="#536982" font-weight="400" text-anchor="start">取消订阅 / 定时器</text><path d="M 325 250 L 395 250" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 685 250 L 755 250" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="46" y="415" font-size="19" fill="#172c48" font-weight="700" text-anchor="start">useEffect(fn, deps)</text><text x="46" y="449" font-size="17" fill="#536982" font-weight="400" text-anchor="start">deps 为空：只执行一次；deps 变化：对应更新后重跑；返回清理函数。</text><rect x="35" y="492" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="522" font-size="17" fill="#536982" font-weight="400" text-anchor="start">副作用指渲染之外的“外部动作”：请求、订阅、定时器、直接操作 DOM。</text></svg>