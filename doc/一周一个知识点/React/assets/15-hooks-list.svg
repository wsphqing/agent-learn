<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="586" viewBox="0 0 1080 586" role="img" aria-labelledby="title desc">
<title id="title">Hooks 的实现：按调用顺序挂链表</title><desc id="desc">函数组件没有实例，状态存在 fiber 节点的链表中；顺序即身份。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="586" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">REACT / 15</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">Hooks 的实现：按调用顺序挂链表</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">函数组件没有实例，状态存在 fiber 节点的链表中；顺序即身份。</text>
<rect x="35" y="170" width="310" height="100" rx="16" fill="#f1ecfd" stroke="#c5d4e6"/><rect x="35" y="185" width="4" height="70" rx="2" fill="#6d28d9"/><text x="53" y="202" font-size="21" fill="#172c48" font-weight="650" text-anchor="start">组件函数执行</text><text x="53" y="232" font-size="16" fill="#536982" font-weight="400" text-anchor="start">每渲染一次就执行一次</text><text x="53" y="257" font-size="16" fill="#536982" font-weight="400" text-anchor="start">Hooks 按顺序被调用</text><rect x="395" y="170" width="310" height="100" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="395" y="185" width="4" height="70" rx="2" fill="#2563eb"/><text x="413" y="202" font-size="21" fill="#172c48" font-weight="650" text-anchor="start">fiber.memoizedState</text><text x="413" y="232" font-size="16" fill="#536982" font-weight="400" text-anchor="start">指向 hook 链表头</text><text x="413" y="257" font-size="16" fill="#536982" font-weight="400" text-anchor="start">保存每个 hook 的数据</text><rect x="755" y="170" width="300" height="100" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="755" y="185" width="4" height="70" rx="2" fill="#008675"/><text x="773" y="202" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">hook 节点链表</text><text x="773" y="232" font-size="16" fill="#536982" font-weight="400" text-anchor="start">useState → useEffect → useRef</text><text x="773" y="257" font-size="16" fill="#536982" font-weight="400" text-anchor="start">每个节点保存状态 / 依赖</text><path d="M 345 220 L 395 220" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="370" y="203" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">挂载</text><path d="M 705 220 L 755 220" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="730" y="203" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">遍历</text><rect x="35" y="390" width="310" height="100" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="35" y="405" width="4" height="70" rx="2" fill="#2563eb"/><text x="53" y="422" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">再次执行</text><text x="53" y="452" font-size="16" fill="#536982" font-weight="400" text-anchor="start">按相同顺序访问链表</text><text x="53" y="477" font-size="16" fill="#536982" font-weight="400" text-anchor="start">复用已有节点</text><rect x="395" y="390" width="310" height="100" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="395" y="405" width="4" height="70" rx="2" fill="#008675"/><text x="413" y="422" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">读取 / 更新</text><text x="413" y="452" font-size="16" fill="#536982" font-weight="400" text-anchor="start">useState 返回新值</text><text x="413" y="477" font-size="16" fill="#536982" font-weight="400" text-anchor="start">useEffect 检查依赖</text><rect x="755" y="390" width="300" height="100" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="755" y="405" width="4" height="70" rx="2" fill="#b75a18"/><text x="773" y="422" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">顺序错位 = 数据错位</text><text x="773" y="452" font-size="16" fill="#536982" font-weight="400" text-anchor="start">条件 / 循环中调用</text><text x="773" y="477" font-size="16" fill="#536982" font-weight="400" text-anchor="start">React 无法对应状态</text><path d="M 190 270 L 190 390" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="263" y="330" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">下一次渲染</text><path d="M 550 270 L 550 390" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="613" y="330" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">同一链表</text><rect x="35" y="513" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="543" font-size="17" fill="#536982" font-weight="400" text-anchor="start">Hooks 没有魔法：它们就是挂在 fiber 上的有序链表。顺序稳定，才能把“第几个调用”对应到“第几份状态”。</text></svg>