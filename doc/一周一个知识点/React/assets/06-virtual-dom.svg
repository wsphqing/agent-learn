<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="586" viewBox="0 0 1080 586" role="img" aria-labelledby="title desc">
<title id="title">虚拟 DOM 与协调（diff）</title><desc id="desc">状态变化 → 重新生成元素树 → 比较差异 → 批量更新真实 DOM。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="586" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">REACT / 06</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">虚拟 DOM 与协调（diff）</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">状态变化 → 重新生成元素树 → 比较差异 → 批量更新真实 DOM。</text>
<rect x="35" y="155" width="300" height="120" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="35" y="170" width="4" height="90" rx="2" fill="#2563eb"/><text x="53" y="187" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">上一次虚拟 DOM</text><text x="53" y="217" font-size="16" fill="#536982" font-weight="400" text-anchor="start">组件状态 S1 的元素树</text><text x="53" y="242" font-size="16" fill="#536982" font-weight="400" text-anchor="start">保存为可比较快照</text><rect x="395" y="155" width="300" height="120" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="395" y="170" width="4" height="90" rx="2" fill="#b75a18"/><text x="413" y="187" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">这一次虚拟 DOM</text><text x="413" y="217" font-size="16" fill="#536982" font-weight="400" text-anchor="start">状态 S2 重新生成的树</text><text x="413" y="242" font-size="16" fill="#536982" font-weight="400" text-anchor="start">与旧树逐层比较</text><rect x="755" y="155" width="300" height="120" rx="16" fill="#f1ecfd" stroke="#c5d4e6"/><rect x="755" y="170" width="4" height="90" rx="2" fill="#6d28d9"/><text x="773" y="187" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">差异结果（diff）</text><text x="773" y="217" font-size="16" fill="#536982" font-weight="400" text-anchor="start">仅变化的节点</text><text x="773" y="242" font-size="16" fill="#536982" font-weight="400" text-anchor="start">插入 / 更新 / 删除</text><path d="M 335 215 L 395 215" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="365" y="197" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">对比</text><path d="M 695 215 L 755 215" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="725" y="197" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">差异</text><rect x="395" y="380" width="660" height="100" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="395" y="395" width="4" height="70" rx="2" fill="#008675"/><text x="413" y="412" font-size="21" fill="#172c48" font-weight="650" text-anchor="start">React 只把变化提交给真实 DOM</text><text x="413" y="442" font-size="16" fill="#536982" font-weight="400" text-anchor="start">最小化 DOM 操作 → 减少重排与重绘</text><text x="413" y="467" font-size="16" fill="#536982" font-weight="400" text-anchor="start">key 帮助 React 识别列表中哪些元素保持不变</text><path d="M 455 275 L 455 380" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="509" y="330" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">仅提交变化</text><text x="46" y="438" font-size="19" fill="#172c48" font-weight="700" text-anchor="start">为什么用虚拟 DOM</text><text x="46" y="472" font-size="17" fill="#536982" font-weight="400" text-anchor="start">直接在浏览器操作 DOM 昂贵；先改内存中的对象，再一次批量提交。</text><rect x="35" y="513" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="543" font-size="17" fill="#536982" font-weight="400" text-anchor="start">虚拟 DOM 是手段而非目标：目标是“用最小代价让界面与状态一致”。</text></svg>