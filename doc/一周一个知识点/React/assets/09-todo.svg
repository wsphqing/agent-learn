<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="638" viewBox="0 0 1080 638" role="img" aria-labelledby="title desc">
<title id="title">Todo 实践：组件拆分与状态流向</title><desc id="desc">一个小项目把 JSX、Props、State、列表渲染串起来。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="638" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">REACT / 09</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">Todo 实践：组件拆分与状态流向</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">一个小项目把 JSX、Props、State、列表渲染串起来。</text>
<rect x="277" y="147" width="768" height="199" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="298" y="171" font-size="17" fill="#536982" font-weight="400" text-anchor="start">状态从 App 流向列表与统计；事件从底部组件向上回调</text><rect x="35" y="187" width="190" height="92" rx="16" fill="#f1ecfd" stroke="#c5d4e6"/><rect x="35" y="202" width="4" height="62" rx="2" fill="#6d28d9"/><text x="53" y="219" font-size="21" fill="#172c48" font-weight="650" text-anchor="start">App</text><text x="53" y="249" font-size="16" fill="#536982" font-weight="400" text-anchor="start">todos 状态</text><text x="53" y="274" font-size="16" fill="#536982" font-weight="400" text-anchor="start">useState + 派生</text><rect x="310" y="187" width="190" height="92" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="310" y="202" width="4" height="62" rx="2" fill="#2563eb"/><text x="328" y="219" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">TodoInput</text><text x="328" y="249" font-size="16" fill="#536982" font-weight="400" text-anchor="start">输入框</text><text x="328" y="274" font-size="16" fill="#536982" font-weight="400" text-anchor="start">提交事件</text><rect x="578" y="187" width="190" height="92" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="578" y="202" width="4" height="62" rx="2" fill="#008675"/><text x="596" y="219" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">TodoList</text><text x="596" y="249" font-size="16" fill="#536982" font-weight="400" text-anchor="start">map 渲染列表</text><text x="596" y="274" font-size="16" fill="#536982" font-weight="400" text-anchor="start">key 定位元素</text><rect x="845" y="187" width="180" height="92" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="845" y="202" width="4" height="62" rx="2" fill="#b75a18"/><text x="863" y="219" font-size="18" fill="#172c48" font-weight="650" text-anchor="start">TodoItem</text><text x="863" y="249" font-size="16" fill="#536982" font-weight="400" text-anchor="start">勾选 / 删除</text><text x="863" y="274" font-size="16" fill="#536982" font-weight="400" text-anchor="start">每行一个组件</text><path d="M 225 232 L 310 232" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="268" y="168" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">新增</text><path d="M 500 232 L 578 232" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="538" y="170" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">数据</text><path d="M 768 232 L 845 232" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="806" y="170" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">渲染</text><rect x="310" y="429" width="385" height="107" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="310" y="444" width="4" height="77" rx="2" fill="#2563eb"/><text x="328" y="461" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">派生数据</text><text x="328" y="491" font-size="16" fill="#536982" font-weight="400" text-anchor="start">剩余未完成数</text><text x="328" y="516" font-size="16" fill="#536982" font-weight="400" text-anchor="start">已完成统计</text><rect x="795" y="429" width="250" height="107" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="795" y="444" width="4" height="77" rx="2" fill="#b75a18"/><text x="813" y="461" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">更新策略</text><text x="813" y="491" font-size="16" fill="#536982" font-weight="400" text-anchor="start">不可直接改原数组</text><text x="813" y="516" font-size="16" fill="#536982" font-weight="400" text-anchor="start">用新数组替换 state</text><text x="36" y="392" font-size="18" fill="#172c48" font-weight="700" text-anchor="start">组件边界</text><text x="36" y="425" font-size="17" fill="#536982" font-weight="400" text-anchor="start">每个组件只关心自己的职责</text><text x="36" y="454" font-size="17" fill="#536982" font-weight="400" text-anchor="start">状态放最小共同父组件</text><rect x="35" y="565" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="595" font-size="17" fill="#536982" font-weight="400" text-anchor="start">练习验收：增、删、勾选都生效；刷新页面后状态重置（持久化见实践二）。</text></svg>