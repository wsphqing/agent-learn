<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="545" viewBox="0 0 1080 545" role="img" aria-labelledby="title desc">
<title id="title">一次状态更新如何到达界面</title><desc id="desc">把“数据变化”翻译成“界面变化”的两阶段过程。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="545" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">REACT / 07</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">一次状态更新如何到达界面</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">把“数据变化”翻译成“界面变化”的两阶段过程。</text>
<rect x="35" y="165" width="230" height="130" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="35" y="180" width="4" height="100" rx="2" fill="#b75a18"/><text x="53" y="197" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">触发渲染</text><text x="53" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">初次挂载</text><text x="53" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">setState / 父组件更新</text><text x="53" y="277" font-size="16" fill="#536982" font-weight="400" text-anchor="start">组件内状态变化</text><rect x="330" y="165" width="230" height="130" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="330" y="180" width="4" height="100" rx="2" fill="#2563eb"/><text x="348" y="197" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">render 阶段</text><text x="348" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">调用组件函数</text><text x="348" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">生成新的元素树</text><text x="348" y="277" font-size="16" fill="#536982" font-weight="400" text-anchor="start">React 内部计算差异</text><rect x="625" y="165" width="230" height="130" rx="16" fill="#f1ecfd" stroke="#c5d4e6"/><rect x="625" y="180" width="4" height="100" rx="2" fill="#6d28d9"/><text x="643" y="197" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">commit 阶段</text><text x="643" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">把变化写入真实 DOM</text><text x="643" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">执行 layout effect</text><text x="643" y="277" font-size="16" fill="#536982" font-weight="400" text-anchor="start">触发 ref 回调</text><rect x="880" y="165" width="165" height="130" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="880" y="180" width="4" height="100" rx="2" fill="#008675"/><text x="898" y="197" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">浏览器绘制</text><text x="898" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">重排 / 重绘</text><text x="898" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">用户看到新界面</text><path d="M 265 230 L 330 230" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 560 230 L 625 230" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 855 230 L 880 230" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="46" y="395" font-size="19" fill="#172c48" font-weight="700" text-anchor="start">一条更新链路</text><text x="46" y="429" font-size="17" fill="#536982" font-weight="400" text-anchor="start">setState → 组件函数重新执行 → 新元素树 → 差异 → 提交 DOM。</text><rect x="35" y="472" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="502" font-size="17" fill="#536982" font-weight="400" text-anchor="start">渲染阶段可能被打断（并发特性）；commit 阶段按顺序提交给 DOM。</text></svg>