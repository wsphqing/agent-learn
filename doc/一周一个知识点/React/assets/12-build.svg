<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="546" viewBox="0 0 1080 546" role="img" aria-labelledby="title desc">
<title id="title">从源码到线上页面</title><desc id="desc">开发、构建、部署三个阶段各做一件事；dist 是交付物。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="546" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">REACT / 12</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">从源码到线上页面</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">开发、构建、部署三个阶段各做一件事；dist 是交付物。</text>
<rect x="35" y="165" width="220" height="145" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="35" y="180" width="4" height="115" rx="2" fill="#2563eb"/><text x="53" y="197" font-size="21" fill="#172c48" font-weight="650" text-anchor="start">01 源码与配置</text><text x="53" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">组件与业务代码</text><text x="53" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">package.json / 依赖</text><text x="53" y="277" font-size="16" fill="#536982" font-weight="400" text-anchor="start">Vite 配置</text><rect x="302" y="165" width="220" height="145" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="302" y="180" width="4" height="115" rx="2" fill="#008675"/><text x="320" y="197" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">02 开发服务器</text><text x="320" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">npm run dev</text><text x="320" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">热更新（HMR）</text><text x="320" y="277" font-size="16" fill="#536982" font-weight="400" text-anchor="start">本地调试</text><rect x="569" y="165" width="220" height="145" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="569" y="180" width="4" height="115" rx="2" fill="#b75a18"/><text x="587" y="197" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">03 生产构建</text><text x="587" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">npm run build</text><text x="587" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">打包 + 压缩</text><text x="587" y="277" font-size="16" fill="#536982" font-weight="400" text-anchor="start">生成 dist/ 静态文件</text><rect x="836" y="165" width="209" height="145" rx="16" fill="#f1ecfd" stroke="#c5d4e6"/><rect x="836" y="180" width="4" height="115" rx="2" fill="#6d28d9"/><text x="854" y="197" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">04 部署托管</text><text x="854" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">静态服务器 / CDN</text><text x="854" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">配置 SPA 回退</text><text x="854" y="277" font-size="16" fill="#536982" font-weight="400" text-anchor="start">HTTPS 访问</text><path d="M 255 240 L 302 240" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="279" y="222" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">dev</text><path d="M 522 240 L 569 240" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="545" y="222" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">build</text><path d="M 789 240 L 836 240" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="812" y="222" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">upload</text><rect x="571" y="362" width="474" height="86" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="571" y="377" width="4" height="56" rx="2" fill="#2563eb"/><text x="589" y="394" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">构建产物是纯静态文件</text><text x="589" y="424" font-size="16" fill="#536982" font-weight="400" text-anchor="start">可交给 Nginx / GitHub Pages / CDN 等任意静态托管</text><text x="46" y="371" font-size="19" fill="#172c48" font-weight="700" text-anchor="start">构建 ≠ 部署</text><text x="46" y="405" font-size="17" fill="#536982" font-weight="400" text-anchor="start">dist 目录里的文件可以单独复制分享；部署只是把它放到能访问的地方。</text><rect x="35" y="473" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="503" font-size="17" fill="#536982" font-weight="400" text-anchor="start">环境变量：构建时注入的配置会在打包时写进产物；运行时注入需要专门方案。</text></svg>