<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="546" viewBox="0 0 1080 546" role="img" aria-labelledby="title desc">
<title id="title">路由：URL 驱动页面切换</title><desc id="desc">路由表把地址映射到组件，SPA 因此拥有多个“页面”。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="546" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">REACT / 11</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">路由：URL 驱动页面切换</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">路由表把地址映射到组件，SPA 因此拥有多个“页面”。</text>
<rect x="35" y="165" width="220" height="145" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="35" y="180" width="4" height="115" rx="2" fill="#b75a18"/><text x="53" y="197" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">浏览器地址栏</text><text x="53" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">/ 或 /todos</text><text x="53" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">刷新 / 前进后退</text><rect x="302" y="165" width="220" height="145" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="302" y="180" width="4" height="115" rx="2" fill="#2563eb"/><text x="320" y="197" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">React Router</text><text x="320" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">匹配 URL 到路由表</text><text x="320" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">切换页面组件</text><rect x="569" y="165" width="220" height="145" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="569" y="180" width="4" height="115" rx="2" fill="#008675"/><text x="587" y="197" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">页面组件</text><text x="587" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">HomePage</text><text x="587" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">TodoPage / DetailPage</text><rect x="836" y="165" width="209" height="145" rx="16" fill="#f1ecfd" stroke="#c5d4e6"/><rect x="836" y="180" width="4" height="115" rx="2" fill="#6d28d9"/><text x="854" y="197" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">共享布局</text><text x="854" y="227" font-size="16" fill="#536982" font-weight="400" text-anchor="start">导航栏</text><text x="854" y="252" font-size="16" fill="#536982" font-weight="400" text-anchor="start">Outlet 内容区</text><path d="M 255 240 L 302 240" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="279" y="222" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">URL</text><path d="M 522 240 L 569 240" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="545" y="222" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">匹配</text><path d="M 789 240 L 836 240" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="812" y="222" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">渲染</text><text x="46" y="371" font-size="19" fill="#172c48" font-weight="700" text-anchor="start">为什么需要路由</text><text x="46" y="405" font-size="17" fill="#536982" font-weight="400" text-anchor="start">单页应用只有一个 HTML；用 URL 驱动组件切换，并支持直接访问与刷新。</text><rect x="35" y="473" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="503" font-size="17" fill="#536982" font-weight="400" text-anchor="start">部署到服务器时要配置 SPA 回退：未匹配路径统一返回 index.html。</text></svg>