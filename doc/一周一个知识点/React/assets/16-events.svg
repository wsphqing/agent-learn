<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="678" viewBox="0 0 1080 678" role="img" aria-labelledby="title desc">
<title id="title">合成事件：委托到 root 再分发</title><desc id="desc">原生事件先冒泡到根容器，React 再按组件树把事件“派发”给对应组件。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="678" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">REACT / 16</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">合成事件：委托到 root 再分发</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">原生事件先冒泡到根容器，React 再按组件树把事件“派发”给对应组件。</text>
<rect x="35" y="150" width="1010" height="215" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="55" y="178" font-size="19" fill="#172c48" font-weight="700" text-anchor="start">浏览器 DOM 树</text><rect x="60" y="205" width="180" height="70" rx="16" fill="#f1ecfd" stroke="#c5d4e6"/><rect x="60" y="220" width="4" height="40" rx="2" fill="#6d28d9"/><text x="78" y="237" font-size="17" fill="#172c48" font-weight="650" text-anchor="start">#root（容器）</text><text x="78" y="267" font-size="16" fill="#536982" font-weight="400" text-anchor="start">事件委托挂载点</text><rect x="320" y="205" width="140" height="70" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="320" y="220" width="4" height="40" rx="2" fill="#2563eb"/><text x="338" y="237" font-size="16" fill="#172c48" font-weight="650" text-anchor="start">button A</text><text x="338" y="267" font-size="16" fill="#536982" font-weight="400" text-anchor="start">onClick</text><rect x="540" y="205" width="140" height="70" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="540" y="220" width="4" height="40" rx="2" fill="#2563eb"/><text x="558" y="237" font-size="16" fill="#172c48" font-weight="650" text-anchor="start">button B</text><text x="558" y="267" font-size="16" fill="#536982" font-weight="400" text-anchor="start">onClick</text><rect x="760" y="205" width="140" height="70" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="760" y="220" width="4" height="40" rx="2" fill="#2563eb"/><text x="778" y="237" font-size="16" fill="#172c48" font-weight="650" text-anchor="start">button C</text><text x="778" y="267" font-size="16" fill="#536982" font-weight="400" text-anchor="start">onClick</text><path d="M 390 275 L 240 275" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="315" y="258" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">冒泡</text><path d="M 610 275 L 240 275" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="425" y="258" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">冒泡</text><path d="M 830 275 L 240 275" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="535" y="258" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">冒泡</text><rect x="395" y="400" width="650" height="100" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="395" y="415" width="4" height="70" rx="2" fill="#2563eb"/><text x="413" y="432" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">React 合成事件系统</text><text x="413" y="462" font-size="16" fill="#536982" font-weight="400" text-anchor="start">在 root 上统一监听原生事件</text><text x="413" y="487" font-size="16" fill="#536982" font-weight="400" text-anchor="start">按 fiber 树模拟组件间的冒泡传播</text><text x="413" y="512" font-size="16" fill="#536982" font-weight="400" text-anchor="start">提供跨浏览器一致的 event 对象</text><path d="M 240 275 L 240 400" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="305" y="340" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">统一处理</text><text x="46" y="540" font-size="19" fill="#172c48" font-weight="700" text-anchor="start">收益</text><text x="46" y="574" font-size="17" fill="#536982" font-weight="400" text-anchor="start">监听器数量少、接口一致；事件优先级可被调度器感知（点击高优先级，滚动低优先级）。</text><rect x="35" y="606" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="636" font-size="17" fill="#536982" font-weight="400" text-anchor="start">合成事件对象在事件处理结束后会被复用；不要在异步回调里长期保存它，需要时先取出字段。</text></svg>