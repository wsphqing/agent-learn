<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="578" viewBox="0 0 1080 578" role="img" aria-labelledby="title desc">
<title id="title">双缓存：渲染不被打断才能提交</title><desc id="desc">两棵树交替使用：一棵展示，一棵构建；提交时整体切换。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
