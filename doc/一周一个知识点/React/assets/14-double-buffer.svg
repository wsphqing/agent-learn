2" font-size="16" fill="#172c48" font-weight="650" text-anchor="start">Header</text><rect x="500" y="350" width="160" height="52" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="500" y="365" width="4" height="22" rx="2" fill="#b75a18"/><text x="518" y="382" font-size="16" fill="#172c48" font-weight="650" text-anchor="start">List</text><rect x="720" y="350" width="160" height="52" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="720" y="365" width="4" height="22" rx="2" fill="#b75a18"/><text x="738" y="382" font-size="16" fill="#172c48" font-weight="650" text-anchor="start">Footer</text><path d="M 260 376 L 300 376" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 460 376 L 500 376" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 660 376 L 720 376" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 180 247 L 180 350" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="240" y="300" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">render 阶段
