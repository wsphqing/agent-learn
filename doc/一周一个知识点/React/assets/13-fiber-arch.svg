<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="586" viewBox="0 0 1080 586" role="img" aria-labelledby="title desc">
<title id="title">Fiber：可中断的渲染工作单元</title><desc id="desc">组件树描述“是什么”，Fiber 链表描述“怎么一步步算出来”。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="586" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">REACT / 13</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">Fiber：可中断的渲染工作单元</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">组件树描述“是什么”，Fiber 链表描述“怎么一步步算出来”。</text>
<rect x="35" y="150" width="240" height="330" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="55" y="180" font-size="19" fill="#172c48" font-weight="700" text-anchor="start">组件树（元素）</text><rect x="55" y="205" width="200" height="52" rx="16" fill="#f1ecfd" stroke="#c5d4e6"/><rect x="55" y="220" width="4" height="22" rx="2" fill="#6d28d9"/><text x="73" y="237" font-size="18" fill="#172c48" font-weight="650" text-anchor="start">App</text><rect x="55" y="278" width="200" height="52" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="55" y="293" width="4" height="22" rx="2" fill="#2563eb"/><text x="73" y="310" font-size="17" fill="#172c48" font-weight="650" text-anchor="start">Header</text><rect x="55" y="351" width="200" height="52" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="55" y="366" width="4" height="22" rx="2" fill="#2563eb"/><text x="73" y="383" font-size="17" fill="#172c48" font-weight="650" text-anchor="start">Panel</text><rect x="55" y="424" width="200" height="52" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="55" y="439" width="4" height="22" rx="2" fill="#2563eb"/><text x="73" y="456" font-size="17" fill="#172c48" font-weight="650" text-anchor="start">Footer</text><path d="M 155 257 L 155 278" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 155 330 L 155 351" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 155 403 L 155 424" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="46" y="528" font-size="17" fill="#536982" font-weight="400" text-anchor="start">组件树 = 嵌套关系</text><text x="46" y="560" font-size="17" fill="#536982" font-weight="400" text-anchor="start">Fiber 树 = 工作单元链表</text><path d="M 275 315 L 340 315" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="308" y="297" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">编译 + 创建</text><rect x="340" y="150" width="705" height="330" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="360" y="180" font-size="19" fill="#172c48" font-weight="700" text-anchor="start">Fiber 节点链表（可中断的工作单元）</text><rect x="360" y="205" width="140" height="90" rx="16" fill="#f1ecfd" stroke="#c5d4e6"/><rect x="360" y="220" width="4" height="60" rx="2" fill="#6d28d9"/><text x="378" y="237" font-size="17" fill="#172c48" font-weight="650" text-anchor="start">fiber(App)</text><text x="378" y="267" font-size="16" fill="#536982" font-weight="400" text-anchor="start">child / return 指针</text><rect x="540" y="205" width="140" height="90" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="540" y="220" width="4" height="60" rx="2" fill="#2563eb"/><text x="558" y="237" font-size="16" fill="#172c48" font-weight="650" text-anchor="start">fiber(Header)</text><text x="558" y="267" font-size="16" fill="#536982" font-weight="400" text-anchor="start">child / return</text><rect x="720" y="205" width="140" height="90" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="720" y="220" width="4" height="60" rx="2" fill="#2563eb"/><text x="738" y="237" font-size="16" fill="#172c48" font-weight="650" text-anchor="start">fiber(Panel)</text><text x="738" y="267" font-size="16" fill="#536982" font-weight="400" text-anchor="start">child / sibling / return</text><rect x="900" y="205" width="100" height="90" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="900" y="220" width="4" height="60" rx="2" fill="#2563eb"/><text x="918" y="237" font-size="14" fill="#172c48" font-weight="650" text-anchor="start">fiber(Footer)</text><text x="918" y="267" font-size="16" fill="#536982" font-weight="400" text-anchor="start">sibling / return</text><path d="M 500 250 L 540 250" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 680 250 L 720 250" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 860 250 L 900 250" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="540" y="340" width="140" height="80" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="540" y="355" width="4" height="50" rx="2" fill="#008675"/><text x="558" y="372" font-size="16" fill="#172c48" font-weight="650" text-anchor="start">fiber(Item1)</text><text x="558" y="402" font-size="16" fill="#536982" font-weight="400" text-anchor="start">child / return</text><rect x="720" y="340" width="140" height="80" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="720" y="355" width="4" height="50" rx="2" fill="#008675"/><text x="738" y="372" font-size="16" fill="#172c48" font-weight="650" text-anchor="start">fiber(Item2)</text><text x="738" y="402" font-size="16" fill="#536982" font-weight="400" text-anchor="start">return</text><path d="M 790 295 L 610 340" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="700" y="312" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">child</text><path d="M 680 380 L 720 380" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="700" y="365" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">sibling</text><text x="360" y="470" font-size="17" fill="#536982" font-weight="400" text-anchor="start">return 指针指回父节点，供渲染完成后向上回溯；每个节点都携带状态、副作用与更新队列。</text><rect x="35" y="513" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="543" font-size="17" fill="#536982" font-weight="400" text-anchor="start">React 15 的递归渲染一旦开始不能中断；Fiber 把渲染拆成小工作单元，为暂停、恢复与优先级调度打下基础。</text></svg>