<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="693" viewBox="0 0 1080 693" role="img" aria-labelledby="title desc">
<title id="title">单向数据流与状态提升</title><desc id="desc">理解数据从哪来、往哪去，是组件设计的第一课。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="693" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">REACT / 04</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">单向数据流与状态提升</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">理解数据从哪来、往哪去，是组件设计的第一课。</text>
<rect x="340" y="150" width="400" height="96" rx="16" fill="#f1ecfd" stroke="#c5d4e6"/><rect x="340" y="165" width="4" height="66" rx="2" fill="#6d28d9"/><text x="358" y="182" font-size="21" fill="#172c48" font-weight="650" text-anchor="start">App：状态 owner（数据源）</text><text x="358" y="212" font-size="16" fill="#536982" font-weight="400" text-anchor="start">useState 保存数据</text><text x="358" y="237" font-size="16" fill="#536982" font-weight="400" text-anchor="start">setState 触发更新</text><rect x="120" y="330" width="200" height="104" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="120" y="345" width="4" height="74" rx="2" fill="#2563eb"/><text x="138" y="362" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">子组件 A</text><text x="138" y="392" font-size="16" fill="#536982" font-weight="400" text-anchor="start">props 只读接收</text><text x="138" y="417" font-size="16" fill="#536982" font-weight="400" text-anchor="start">事件回调上报</text><rect x="460" y="330" width="200" height="104" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="460" y="345" width="4" height="74" rx="2" fill="#2563eb"/><text x="478" y="362" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">子组件 B</text><text x="478" y="392" font-size="16" fill="#536982" font-weight="400" text-anchor="start">props 只读接收</text><text x="478" y="417" font-size="16" fill="#536982" font-weight="400" text-anchor="start">事件回调上报</text><rect x="760" y="330" width="200" height="104" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="760" y="345" width="4" height="74" rx="2" fill="#2563eb"/><text x="778" y="362" font-size="19" fill="#172c48" font-weight="650" text-anchor="start">子组件 C</text><text x="778" y="392" font-size="16" fill="#536982" font-weight="400" text-anchor="start">props 只读接收</text><text x="778" y="417" font-size="16" fill="#536982" font-weight="400" text-anchor="start">事件回调上报</text><path d="M 455 246 L 220 330" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="337" y="288" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">props 数据向下</text><path d="M 520 246 L 560 330" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="540" y="290" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">props</text><path d="M 520 246 L 860 330" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="690" y="290" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">props</text><path d="M 220 434 L 455 498" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="337" y="470" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">事件向上</text><path d="M 560 434 L 520 498" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="540" y="470" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">回调</text><path d="M 860 434 L 520 498" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="690" y="470" font-size="15" fill="#536982" font-weight="400" text-anchor="middle">回调</text><rect x="340" y="498" width="400" height="96" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="340" y="513" width="4" height="66" rx="2" fill="#008675"/><text x="358" y="530" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">状态提升到共同父组件</text><text x="358" y="560" font-size="16" fill="#536982" font-weight="400" text-anchor="start">多个子组件共享同一份数据</text><text x="358" y="585" font-size="16" fill="#536982" font-weight="400" text-anchor="start">修改集中在父组件</text><text x="46" y="398" font-size="19" fill="#172c48" font-weight="700" text-anchor="start">单向数据流</text><text x="46" y="432" font-size="17" fill="#536982" font-weight="400" text-anchor="start">数据沿组件树向下流动；修改通过事件回调向上传递。</text><rect x="35" y="620" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="650" font-size="17" fill="#536982" font-weight="400" text-anchor="start">State 是组件私有的；需要共享时提升到最近的共同父组件。</text></svg>