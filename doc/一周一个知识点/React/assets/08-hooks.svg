<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="626" viewBox="0 0 1080 626" role="img" aria-labelledby="title desc">
<title id="title">Hooks：函数组件的工具箱</title><desc id="desc">按场景选工具，而不是记住每一个 API 的细节。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1080" height="626" rx="22" fill="#f7faff"/>
<text x="35" y="37" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">REACT / 08</text><text x="35" y="78" font-size="29" fill="#172c48" font-weight="700" text-anchor="start">Hooks：函数组件的工具箱</text><text x="35" y="110" font-size="17" fill="#536982" font-weight="400" text-anchor="start">按场景选工具，而不是记住每一个 API 的细节。</text>
<text x="36" y="176" font-size="19" fill="#172c48" font-weight="700" text-anchor="start">常用 Hooks</text><rect x="35" y="195" width="230" height="118" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="35" y="210" width="4" height="88" rx="2" fill="#2563eb"/><text x="53" y="227" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">useState</text><text x="53" y="257" font-size="16" fill="#536982" font-weight="400" text-anchor="start">组件内可变状态</text><text x="53" y="282" font-size="16" fill="#536982" font-weight="400" text-anchor="start">返回 [值, 更新函数]</text><rect x="295" y="195" width="230" height="118" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="295" y="210" width="4" height="88" rx="2" fill="#b75a18"/><text x="313" y="227" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">useEffect</text><text x="313" y="257" font-size="16" fill="#536982" font-weight="400" text-anchor="start">副作用时机</text><text x="313" y="282" font-size="16" fill="#536982" font-weight="400" text-anchor="start">依赖数组控制执行</text><rect x="555" y="195" width="230" height="118" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="555" y="210" width="4" height="88" rx="2" fill="#008675"/><text x="573" y="227" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">useRef</text><text x="573" y="257" font-size="16" fill="#536982" font-weight="400" text-anchor="start">跨渲染保存值</text><text x="573" y="282" font-size="16" fill="#536982" font-weight="400" text-anchor="start">不触发重新渲染</text><rect x="815" y="195" width="230" height="118" rx="16" fill="#f1ecfd" stroke="#c5d4e6"/><rect x="815" y="210" width="4" height="88" rx="2" fill="#6d28d9"/><text x="833" y="227" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">useMemo</text><text x="833" y="257" font-size="16" fill="#536982" font-weight="400" text-anchor="start">缓存计算结果</text><text x="833" y="282" font-size="16" fill="#536982" font-weight="400" text-anchor="start">依赖不变则复用</text><rect x="35" y="395" width="230" height="118" rx="16" fill="#edf4ff" stroke="#c5d4e6"/><rect x="35" y="410" width="4" height="88" rx="2" fill="#2563eb"/><text x="53" y="427" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">useCallback</text><text x="53" y="457" font-size="16" fill="#536982" font-weight="400" text-anchor="start">缓存函数引用</text><text x="53" y="482" font-size="16" fill="#536982" font-weight="400" text-anchor="start">配合 memo 使用</text><rect x="295" y="395" width="230" height="118" rx="16" fill="#e8f7f2" stroke="#c5d4e6"/><rect x="295" y="410" width="4" height="88" rx="2" fill="#008675"/><text x="313" y="427" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">useContext</text><text x="313" y="457" font-size="16" fill="#536982" font-weight="400" text-anchor="start">跨层级共享数据</text><text x="313" y="482" font-size="16" fill="#536982" font-weight="400" text-anchor="start">避免逐层传 props</text><rect x="555" y="395" width="230" height="118" rx="16" fill="#f1ecfd" stroke="#c5d4e6"/><rect x="555" y="410" width="4" height="88" rx="2" fill="#6d28d9"/><text x="573" y="427" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">自定义 Hook</text><text x="573" y="457" font-size="16" fill="#536982" font-weight="400" text-anchor="start">以 use 开头</text><text x="573" y="482" font-size="16" fill="#536982" font-weight="400" text-anchor="start">封装可复用逻辑</text><rect x="815" y="395" width="230" height="118" rx="16" fill="#fff3e6" stroke="#c5d4e6"/><rect x="815" y="410" width="4" height="88" rx="2" fill="#b75a18"/><text x="833" y="427" font-size="20" fill="#172c48" font-weight="650" text-anchor="start">规则</text><text x="833" y="457" font-size="16" fill="#536982" font-weight="400" text-anchor="start">顶层调用</text><text x="833" y="482" font-size="16" fill="#536982" font-weight="400" text-anchor="start">不能在条件 / 循环中调用</text><rect x="35" y="553" width="1010" height="48" rx="16" fill="#fff" stroke="#c5d4e6"/><text x="53" y="583" font-size="17" fill="#536982" font-weight="400" text-anchor="start">Hooks 让函数组件拥有状态与副作用能力；顺序稳定是它们工作的前提。</text></svg>